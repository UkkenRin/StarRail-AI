name: Build Android experimental APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-debug.yml'
      - 'android_overlay/**'
      - 'scripts/apply_android_overlay.py'
      - 'scripts/build_scene_knowledge.py'
      - 'data/game_scenes.json'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-debug.yml'
      - 'android_overlay/**'
      - 'scripts/apply_android_overlay.py'
      - 'scripts/build_scene_knowledge.py'
      - 'data/game_scenes.json'
      - 'tests/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test local overlay
        run: python3 -m unittest discover -s tests -v
      - name: Fetch fixed upstream release
        run: git clone --depth 1 --branch v2026.11.19 https://github.com/moesnow/March7thAssistant.git upstream
      - name: Validate fixed-upstream scene knowledge snapshot
        run: |
          python3 scripts/build_scene_knowledge.py upstream --output /tmp/starrail-scenes-verified.json
          diff -u data/game_scenes.json /tmp/starrail-scenes-verified.json
      - name: Apply AI advisor patch
        run: python3 scripts/apply_android_overlay.py upstream
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@v6
      - name: Prepare Android SDK components
        working-directory: upstream/Android
        run: |
          platform=$(sed -n 's/^m7a\.androidPlatform=//p' gradle.properties)
          build_tools=$(sed -n 's/^m7a\.buildTools=//p' gradle.properties)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;$platform" "build-tools;$build_tools"
      - name: Build debug APK with upstream toolchain
        working-directory: upstream/Android
        run: |
          uv python install 3.14.8
          python=$(uv python find --no-project 3.14.8)
          "$python" app/prepare_wheels.py app/build/wheelhouse
          ./gradlew --no-daemon :device-service:test :device-service:dexJar :app:testDebugUnitTest :app:assembleDebug "-Pm7a.hostPython=$python" -Pm7a.versionCode=1
      - uses: actions/upload-artifact@v4
        with:
          name: starrail-ai-android-debug
          path: upstream/Android/app/build/universal/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # Only main builds publish. PRs retain read-only build permissions.
  publish:
    name: Update stable Android APK download
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: starrail-android-rolling-release
      cancel-in-progress: false
    steps:
      - name: Download the APK built by this successful workflow
        uses: actions/download-artifact@v4
        with:
          name: starrail-ai-android-debug
          path: dist
      - name: Validate APK archive and prepare stable asset name
        run: |
          set -euo pipefail
          test -s dist/app-debug.apk
          unzip -t dist/app-debug.apk >/dev/null
          unzip -Z1 dist/app-debug.apk | grep '^AndroidManifest.xml$'
          cp dist/app-debug.apk dist/StarRail-AI-debug.apk
          sha256sum dist/StarRail-AI-debug.apk
      - name: Publish or replace fixed-tag GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A slower, older build must not overwrite a newer main build.
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Main moved since this build; skip obsolete APK publishing."
            exit 0
          fi
          cat > release-notes.md <<EOF
          StarRail-AI Android debug 实验版（CI 自动发布；尚未通过设备验收）。

          构建提交： https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA
          构建工作流： https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          对应源代码：
          - StarRail-AI: https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA
          - 上游 March7thAssistant (固定版本 v2026.11.19): https://github.com/moesnow/March7thAssistant/tree/v2026.11.19
          - 许可信息： https://github.com/$GITHUB_REPOSITORY/blob/main/LICENSE

          本 APK 不等于 AI 已能自主玩游戏。它是 Debug 构建，自动更新的是下载链接中的 APK 文件，不会自动更新设备上已安装的应用。不同 CI 构建可能使用不同的临时 Debug 签名；覆盖安装可能失败。请先备份本地重要数据，避免直接卸载导致档案丢失。
          EOF
          asset="dist/StarRail-AI-debug.apk#StarRail-AI-debug.apk"
          if gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-latest "$asset" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit android-latest --title "StarRail-AI Android 自动更新实验版" --prerelease --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create android-latest "$asset" --target "$GITHUB_SHA" --title "StarRail-AI Android 自动更新实验版" --prerelease --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          fi
          echo "Stable APK: https://github.com/$GITHUB_REPOSITORY/releases/download/android-latest/StarRail-AI-debug.apk"
